services:
  db:
    image: postgres:15-alpine
    container_name: hypnoria-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgadmin}
      POSTGRES_DB: ${POSTGRES_DB:-hypnoriadb}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hypnoriadb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hypnoria-backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-pgadmin}@db:5432/${POSTGRES_DB:-hypnoriadb}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hypnoria-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
